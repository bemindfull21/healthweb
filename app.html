<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>몸무게 기록</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="wrap">
    <header class="dash-head">
      <h1>몸무게 기록</h1>
      <div class="dash-actions">
        <button id="refresh" class="ghost" type="button" hidden>↻ 새로고침</button>
        <button id="logout" class="ghost" type="button">로그아웃</button>
      </div>
    </header>
    <p id="account" class="muted sm"></p>

    <!-- 텔레그램 인증 게이트 (미인증 계정) -->
    <section id="verify-gate" hidden>
      <div class="panel gate">
        <h2>텔레그램 인증이 필요합니다</h2>
        <p class="muted">
          이 User ID가 본인 것인지 확인합니다. 헬스봇에게 아래 명령을 보내세요.
        </p>
        <p class="code-line"><code id="verify-cmd">/link ------</code></p>
        <button id="verify-recheck" type="button">인증했어요</button>
        <p id="verify-msg" class="form-msg" hidden></p>
      </div>
    </section>

    <!-- 대시보드 -->
    <section id="dashboard" hidden>
      <p id="staleness" class="staleness" hidden>
        <span class="dot" aria-hidden="true"></span>
        <span id="staleness-text">실시간 연결 안 됨</span>
        <button id="staleness-retry" type="button">다시 시도</button>
      </p>

      <p id="banner" class="banner" hidden></p>

      <div id="stats" class="stats"></div>

      <div class="panel">
        <div class="panel-head">
          <span>추이</span>
          <div id="range" class="range">
            <button data-days="7">7일</button>
            <button data-days="30" class="on">30일</button>
            <button data-days="90">90일</button>
            <button data-days="0">전체</button>
          </div>
        </div>
        <div class="chart-box"><canvas id="chart"></canvas></div>
      </div>

      <div class="panel">
        <div class="panel-head"><span>기록</span></div>
        <div class="table-scroll">
          <table id="log">
            <thead><tr><th>일시</th><th>몸무게</th><th>증감</th><th>오늘의 한 문장</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <p class="muted foot">
        마지막 갱신: <span id="updated">-</span> ·
        페이지를 열 때마다 실시간으로 갱신됩니다.
      </p>
    </section>

    <section id="empty" hidden>
      <div class="panel">
        <p class="muted">아직 기록이 없습니다. 헬스봇에게 몸무게를 보내 보세요.</p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="./config.js"></script>
  <script src="./dashboard.js"></script>
</body>
</html>
