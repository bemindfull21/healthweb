<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>몸무게 기록</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="wrap">
    <!-- 등록 화면 -->
    <section id="register" hidden>
      <h1>몸무게 기록</h1>
      <p class="muted">
        내 텔레그램 User ID로 봇에 저장된 몸무게를 조회합니다.
        User ID는 헬스봇에게 <code>/whoami</code> 를 보내면 확인할 수 있습니다.
      </p>
      <form id="register-form">
        <label>
          텔레그램 User ID
          <input id="uid-input" inputmode="numeric" autocomplete="off" required
                 placeholder="예: 1234567890" />
        </label>
        <label>
          목표 몸무게 (kg, 선택)
          <input id="target-input" type="number" step="0.1" min="20" max="300"
                 autocomplete="off" placeholder="예: 68" />
        </label>
        <button type="submit">조회</button>
        <p id="register-error" class="error" hidden></p>
      </form>
    </section>

    <!-- 대시보드 -->
    <section id="dashboard" hidden>
      <header class="dash-head">
        <h1>몸무게 기록</h1>
        <div class="dash-actions">
          <button id="refresh" class="ghost" type="button" hidden>↻ 새로고침</button>
          <button id="logout" class="ghost" type="button">다른 ID로 보기</button>
        </div>
      </header>

      <p id="staleness" class="staleness" hidden>
        <span class="dot" aria-hidden="true"></span>
        <span id="staleness-text">실시간 연결 안 됨</span>
        <button id="staleness-retry" type="button">다시 시도</button>
      </p>

      <p id="banner" class="banner" hidden></p>

      <div id="stats" class="stats"></div>

      <div class="panel">
        <div class="panel-head">
          <span>추이</span>
          <div id="range" class="range">
            <button data-days="7">7일</button>
            <button data-days="30" class="on">30일</button>
            <button data-days="90">90일</button>
            <button data-days="0">전체</button>
          </div>
        </div>
        <div class="chart-box"><canvas id="chart"></canvas></div>
      </div>

      <div class="panel">
        <div class="panel-head"><span>기록</span></div>
        <div class="table-scroll">
          <table id="log">
            <thead><tr><th>일시</th><th>몸무게</th><th>증감</th><th>오늘의 한 문장</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <p class="muted foot">
        마지막 갱신: <span id="updated">-</span> ·
        페이지를 열 때마다 실시간으로 갱신됩니다.
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
