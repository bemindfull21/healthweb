name: refresh-weight-data

on:
  schedule:
    - cron: "0 18 * * *"           # 매일 1회 (UTC 18:00 = KST 03:00).
                                    # 실시간 조회는 라이브 API가 담당 — 이 스냅샷은 VM 다운 시 폴백용.
  workflow_dispatch:                # 수동 실행
  repository_dispatch:
    types: [healthbot-new-weight]   # (선택) health-bot이 새 기록 저장 시 트리거

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wallet 복원
        env:
          B64: ${{ secrets.WALLET_ZIP_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${B64:-}" ]; then
            echo "::error::WALLET_ZIP_B64 secret이 설정되지 않았습니다."
            exit 1
          fi
          printf '%s' "$B64" | tr -d '[:space:]' | base64 -d > wallet.zip
          echo "wallet.zip: $(wc -c < wallet.zip) bytes"
          mkdir -p wallet
          unzip -o -q wallet.zip -d wallet
          ls -1 wallet
          test -f wallet/tnsnames.ora && echo "wallet OK"

      - name: 의존성 설치
        run: pip install -r scripts/requirements.txt

      - name: weight_log 내보내기
        env:
          DB_USER: healthweb
          DB_DSN: shindb_low
          DB_WALLET_LOCATION: wallet
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_WALLET_PASSWORD: ${{ secrets.DB_WALLET_PASSWORD }}
        run: python scripts/export_weights.py

      - name: 변경 시 커밋
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/users
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 $(date -u +%FT%TZ)"
            # checkout@v4가 detached HEAD로 두므로 명시적 refspec으로 push
            git push origin "HEAD:${{ github.ref_name }}"
          fi
